[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hgvs_extractor"
dynamic = ["version"]
description = "Extract HGVS variant descriptions (g., c., r., p.) from a reference and a variant nucleotide sequence"
readme = "README.md"
requires-python = ">=3.10"
license = "CC0-1.0"
license-files = ["LICENSE"]
authors = [{ name = "Nick Moore" }]
dependencies = []
keywords = ["HGVS", "variant", "nomenclature", "bioinformatics", "genomics", "sequence"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]

[project.optional-dependencies]
# rapidfuzz is only used to size the alignment band: same results, faster on multi-change reads
fast = ["rapidfuzz>=3"]
test = ["pytest>=7", "pytest-cov>=5", "hypothesis>=6.100"]
dev = ["hgvs_extractor[fast,test]", "black>=24", "pylint>=3", "mypy>=1.8"]

[project.urls]
Repository = "https://github.com/nickzoic/hgvs-extractor"
Issues = "https://github.com/nickzoic/hgvs-extractor/issues"
"HGVS Nomenclature" = "https://hgvs-nomenclature.org/stable/"

[tool.setuptools.dynamic]
version = { attr = "hgvs_extractor.__version__" }

[tool.setuptools.package-data]
hgvs_extractor = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests", "src", "README.md"]
addopts = ["--doctest-modules", "--doctest-glob=README.md", "--import-mode=importlib"]
# src: tests run from a checkout without installing; tests: shared test helpers
pythonpath = ["src", "tests"]

[tool.coverage.run]
source = ["hgvs_extractor"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.black]
line-length = 120

[tool.pylint.format]
max-line-length = 120

[tool.pylint."messages control"]
disable = [
    "missing-function-docstring",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-positional-arguments",
    # the HGVS rules are a sequence of distinct cases; splitting them up hides that
    "too-many-branches",
    "too-many-locals",
    "too-many-return-statements",
    # the tests' full alignment deliberately mirrors the traceback of the banded one
    "duplicate-code",
]

[tool.mypy]
mypy_path = "src:tests"
ignore_missing_imports = true
