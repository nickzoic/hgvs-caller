name: tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }}${{ matrix.fast && ', rapidfuzz' || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        fast: [false, true]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test${{ matrix.fast && ',fast' || '' }}]"
      - name: Test, with coverage
        run: python -m pytest -v --cov --cov-report=term-missing --cov-fail-under=100
      - name: Coverage summary
        run: python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  fuzz:
    name: fuzz tests (Hypothesis, 20000 examples per test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,fast]"
      - name: Fuzz
        run: python -m pytest -v tests/test_fuzz.py --hypothesis-profile=fuzz --hypothesis-show-statistics
      - name: Randomized tests, more cases
        env:
          HGVS_CALLER_PROPERTY_CASES: "30000"
        run: python -m pytest -v tests/test_properties.py

  lint:
    name: black, pylint, mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: black
        run: black --check --diff src tests tools
      - name: pylint
        run: pylint src tests tools
      - name: mypy
        run: mypy src tests tools

  package:
    name: build and test the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Test the installed wheel
        # Run the tests against the installed package, not the checkout: no src/ on the path,
        # so files missing from the wheel would make the tests fail.
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install "$(ls dist/*.whl)[test]"
          /tmp/wheel-env/bin/python -m pytest -v -o pythonpath=tests tests README.md --doctest-modules --pyargs hgvs_caller
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
